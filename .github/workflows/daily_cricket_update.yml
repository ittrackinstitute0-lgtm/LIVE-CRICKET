name: Daily Cricket Match Verifier & Live Update

on:
  push:
    branches: ["main"]
  schedule:
    # Runs automatically every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab anytime

permissions:
  contents: write

jobs:
  update-matches:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch & Verify Real World Cricket Matches
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python update_matches.py

      - name: Commit and Push Updated Matches
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app.js
          if git diff --staged --quiet; then
            echo "No match changes detected in this cycle."
          else
            git commit -m "chore(cricket): Automated verified real match update"
            git push origin main
          fi
